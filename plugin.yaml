name: mem-reflection-hermes
version: 0.8.0
description: "Self-evolving memory & reflection system. Memory Palace (core/work/episode/general/project:*), 17 SRH tools, dual scope (user+project), TF-IDF/BM25 + ONNX semantic search, effectiveness tracking with decay, micro/full reflection, skill auto-matching, profile compilation, ahe_graph graph memory, zone rebalance, CJK adaptive threshold, LRU embed cache. v0.8: 6-module architecture (core/embed/reflection/hooks/tools/__init__), backpressure queues, memory history/supersedes lineage."
author: "ported from coder-brzhang/small-rust-hermes"
provides_tools:
  - srh_memory_search
  - srh_memory_write
  - srh_memory_delete
  - srh_memory_history
  - srh_skill_search
  - srh_reflect_now
  - srh_palace_zones
  - srh_palace_read_zone
  - srh_palace_recall
  - srh_palace_search
  - srh_palace_rebalance
  - srh_compile_profile
  - srh_associate
  - srh_graph_retrieve
  - srh_graph_stats
  - srh_graph_viz
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_tool_call
kind: standalone

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    store: memory store persistence, lineage, and index maintenance tests
    search: search engine and ranking behavior tests
    retrieval: retrieval quality, fusion, bm25, rerank, and recall tests
    graph: graph memory and activation propagation tests
    reflection: reflection engine and reflection-runtime tests
    runtime: runtime hooks, checkpoint, compaction, and runtime integration tests
    context: context assembly and injection tests
    curator: memory curator lifecycle tests
    bridge: builtin/plugin memory bridge tests
    dashboard: dashboard and web API endpoint tests
    tools: runtime tool handler tests
    backend: search backend capability abstraction tests
    config: typed configuration and diagnostics tests
    contract: host-facing compatibility and smoke-contract tests
    compaction: episode compaction tests
    reranker: reranker abstraction and integration tests
    e2e: end-to-end lifecycle and multi-surface integration tests
    integration: integration-style tests spanning multiple modules
    smoke: lightweight smoke/contract gates
    compatibility: compatibility and legacy-surface regression tests
    cjk: CJK tokenization and multilingual retrieval tests
    ; v1.4 functional area markers
    v14_context: tests added or extended for v1.4 context reliability
    v14_retrieval: tests added or extended for v1.4 retrieval quality and explainability
    v14_runtime: tests added or extended for v1.4 runtime reliability
    v14_entity: tests added or extended for v1.4 entity recall and backend readiness
    v14_contract: tests used as v1.4 contract acceptance gates
    v14_config: tests for v1.4 typed config and diagnostics
    v14_backend: tests for v1.4 backend capability abstraction
    v14_hooks: tests for v1.4 v0.16.0 enhanced runtime hooks
    ; v1.4 combined marker (all v1.4 tests)
    v14: all v1.4 new feature and enhancement tests (combined)

name: mem-reflection-hermes
version: 1.0-beta
description: "Self-evolving memory & reflection system. Memory Palace (core/work/episode/general/project:*), 16 SRH tools, dual scope (user+project), TF-IDF/BM25 + ONNX semantic search, effectiveness tracking with decay, micro/full reflection, skill auto-matching, profile compilation, ahe_graph graph memory, zone rebalance, CJK adaptive threshold, LRU embed cache. v0.8: 6-module architecture. v0.9: CLUQI cross-layer query, PageRank centrality, SUPERSEDES graph edges, query templates, result cache, cross-zone analysis. v0.9.2: Dashboard full ahe_graph integration with Hebbian edges, node click highlighting, zone bridge visualization, CLUQI search UI."
author: "ported from coder-brzhang/small-rust-hermes"
provides_tools:
  - srh_memory_search
  - srh_memory_write
  - srh_memory_delete
  - srh_memory_history
  - srh_skill_search
  - srh_reflect_now
  - srh_palace_zones
  - srh_palace_read_zone
  - srh_palace_recall
  - srh_palace_search
  - srh_palace_rebalance
  - srh_compile_profile
  - srh_associate
  - srh_graph_retrieve
  - srh_graph_stats
  - srh_graph_viz
  - srh_memory_health
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_tool_call
kind: standalone

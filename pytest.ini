# pytest configuration for mem-reflection-hermes.
#
# Marker taxonomy
# ────────────────
# Markers are auto-assigned per-file in tests/conftest.py (see _FILE_MARKERS
# and the v1.4 node-level overrides). This file *registers* them so that:
#   - `pytest --markers` lists them cleanly,
#   - `pytest -W error::pytest.PytestUnknownMarkWarning` catches typos,
#   - `pytest -m "<expr>"` works for every documented group.
#
# Three layers:
#   1. functional surface  — store / search / retrieval / graph / reflection /
#      scope / supersedes / sidecar / extraction / context / runtime / curator /
#      events / compaction / config / backend / bridge / dashboard / tools /
#      contract / smoke / e2e / integration / compatibility / cjk / reranker.
#   2. version acceptance  — v16 (event ledger + scoped filters),
#      v17 (round-3 P1/P2 functional fixes).
#   3. v1.4 regression      — v14_context / v14_retrieval / v14_runtime /
#      v14_entity / v14_contract / v14_hooks.
#
# See docs/testing/test-coverage.md for the grouping rationale and example
# selection commands.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
# Note: markers are auto-assigned per-file in tests/conftest.py via
# item.add_marker(getattr(pytest.mark, ...)). That dynamic-assignment path
# emits a benign PytestUnknownMarkWarning even for ini-registered marks on
# some pytest versions; do NOT promote it to an error, or CI breaks. The
# `markers =` section below is what makes `pytest --markers` and `-m <expr>`
# work.

markers =
    # ── functional surface ────────────────────────────────────────────
    store: memory store, frontmatter, atomic write, lineage
    search: search index and retrieval paths
    retrieval: retrieval-channel behaviour (BM25 / embedding / fusion)
    reranker: second-stage reranker integration
    cjk: CJK tokenisation and weighting behaviour
    graph: Hebbian graph + typed fact sidecar
    sidecar: typed fact sidecar (Phase D) write/invalidate
    reflection: reflection pipelines (micro / full / embedding / raw)
    extraction: refined candidate extraction (Phase B)
    supersedes: semantic supersedes resolver (Phase C)
    scope: scope filter semantics and ScopeIntent (v1.6 + round-3)
    compaction: episode compaction and fallback summarisation
    context: context assembly, bundle split, compression
    runtime: runtime hooks, checkpoint, late-binding dispatch
    curator: memory curator actions and pipeline
    events: memory event ledger (v1.6)
    config: typed config model and diagnostics
    backend: backend capability abstraction
    bridge: built-in ↔ plugin memory bridge
    dashboard: dashboard API and graph views
    tools: runtime tool handlers
    contract: host-facing contract and registration
    smoke: smoke-level acceptance
    e2e: end-to-end lifecycle
    integration: integration-level suites
    compatibility: backward-compatibility shims and aliases
    # ── version acceptance ────────────────────────────────────────────
    v14: v1.4-era regression coverage (coarse file-level tag)
    v16: v1.6 acceptance (event ledger + scoped filters)
    v17: v1.7 round-3 acceptance (typed sidecar invalidation, semantic supersedes, kind typing, ScopeIntent)
    # ── v1.4 regression slices ────────────────────────────────────────
    v14_context: v1.4 stable/dynamic context split
    v14_retrieval: v1.4 CJK tokenizer + explainable retrieval
    v14_runtime: v1.4 checkpoint recovery + typed config diagnostics
    v14_entity: v1.4 entity index lifecycle + backend readiness
    v14_contract: v1.4 host-facing compatibility gate
    v14_hooks: v0.16.0 enhanced runtime hooks
